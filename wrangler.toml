name = "wacky-travel"
compatibility_date = "2026-05-06"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "TRAVEL_DB"
database_name = "wacky-travel-db"
database_id = "a172c735-910b-44c9-86a1-ee691ebf7ca4"

[vars]
# 사용자 지정 도메인을 연결하면 이 값만 실제 운영 주소로 변경하세요.
SITE_ORIGIN = "https://wacky-travel.pages.dev"
# 사용자 지정 도메인으로 308 통일할 때 true로 변경하세요.
ENFORCE_SITE_ORIGIN = "false"

