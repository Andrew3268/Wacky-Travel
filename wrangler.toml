name = "wacky-travel"
compatibility_date = "2026-05-06"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "TRAVEL_DB"
database_name = "wacky-travel-db"
database_id = "a172c735-910b-44c9-86a1-ee691ebf7ca4"

[vars]
# 연결 완료된 공식 도메인입니다.
SITE_ORIGIN = "https://bestayable.com"
# 공식 도메인을 canonical·사이트맵·robots 기준 주소로 사용합니다.
CUSTOM_DOMAIN_CONNECTED = "true"
# pages.dev 및 다른 호스트 요청을 공식 도메인으로 통일합니다.
ENFORCE_SITE_ORIGIN = "true"

# 운영 전 실제 값으로 교체하세요!
# ADSENSE_CLIENT = "ca-pub-xxxxxxxxxxxxxxxx"
# ADSENSE_SLOT_SIDEBAR = "1234567890"
# ADSENSE_SLOT_INARTICLE_1 = "1234567890"
# ADSENSE_SLOT_INARTICLE_2 = "1234567890"
