          <strong class="dashboard-stat__value" id="adminPostPublishedCount">-</strong>
          <span class="dashboard-stat__hint">발행 글 전체 보기</span>
        </a>
        <a class="dashboard-stat dashboard-stat--link admin-post-status-tab" href="/admin/post-list.html?status=draft" data-status-tab="draft">

        <div class="admin-post-list-tools">
          <label class="sr-only" for="adminPostListSearch">글 검색</label>

      <div class="admin-post-list-table-wrap">
        <table class="admin-post-list-table">
          <thead>
            <tr>
              <th scope="col">제목</th>
              <th scope="col">종류</th>
              <th scope="col">연결</th>
              <th scope="col">작성/수정일</th>
              <th scope="col">관리</th>
            </tr>
          </thead>
          <tbody id="adminPostListBody">
            <tr><td colspan="5" class="admin-post-list-empty">불러오는 중입니다.</td></tr>
